name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release assets for (e.g. v0.3.1)'
        required: true
        default: 'v0.3.1'

permissions:
  contents: write

jobs:
  build-python:
    name: Build Python Wheel & Sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak Bundle (.flatpak)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.Dackerie.Showberry.flatpak
          manifest-path: packaging/flathub/io.github.Dackerie.Showberry.json
          cache: true
          branch: stable

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: io.github.Dackerie.Showberry.flatpak
          if-no-files-found: warn

  build-appimage:
    name: Build AppImage (.AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libmpv-dev \
            mpv \
            python3-gi \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel \
            libglib2.0-dev-bin \
            desktop-file-utils \
            libfuse2t64 \
            wget \
            file

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-bundle
          path: Showberry-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Run Windows build script in UCRT64
        shell: msys2 {0}
        run: |
          bash ./packaging/windows/build.sh

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: packaging/windows/showberry.iss

      - name: Create Windows Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\showberry\* -DestinationPath Showberry-Windows-Portable-x86_64.zip

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output/Showberry-Windows-Setup-x86_64.exe
          if-no-files-found: error

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: Showberry-Windows-Portable-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install gtk4 libadwaita adwaita-icon-theme python3 pygobject3 mpv create-dmg libtorrent-rasterbar || true
          python3 -m pip install --break-system-packages \
            requests \
            pillow \
            curl_cffi \
            pycryptodome \
            cryptography \
            PyOpenGL \
            python-mpv \
            pyinstaller

      - name: Run macOS build script
        env:
          ARCH: arm64
        run: |
          bash ./packaging/macos/build.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: Showberry-macOS-*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-24.04
    needs: [build-python, build-flatpak, build-appimage, build-windows, build-macos]
    if: always() && !cancelled() && needs.build-python.result == 'success'
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "=== Release Assets & Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-assets/*
          generate_release_notes: true
