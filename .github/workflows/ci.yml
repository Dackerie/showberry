name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libmpv-dev \
            mpv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            desktop-file-utils \
            appstream \
            libglib2.0-dev-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest requests pillow curl_cffi pycryptodome PyOpenGL python-mpv

      - name: Validate GSettings Schema
        run: |
          glib-compile-schemas --strict data/

      - name: Validate Desktop Entry
        run: |
          desktop-file-validate data/com.github.showberry.Showberry.desktop

      - name: Validate AppStream Metadata
        run: |
          appstreamcli validate --no-net data/com.github.showberry.Showberry.metainfo.xml

      - name: Run Test Suite
        env:
          GSK_RENDERER: cairo
        run: |
          python -m pytest tests/ -v

      - name: Build Python Wheel
        run: |
          python -m build --wheel --no-isolation
