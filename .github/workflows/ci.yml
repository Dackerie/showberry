name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libmpv-dev \
            mpv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            desktop-file-utils \
            appstream \
            libglib2.0-dev-bin \
            python3-venv \
            python3-pip \
            python3-libtorrent \
            xvfb \
            xauth

      - name: Set up Python virtual environment
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install build pytest requests pillow curl_cffi pycryptodome PyOpenGL python-mpv

      - name: Validate GSettings Schema
        run: |
          glib-compile-schemas --strict data/

      - name: Validate Desktop Entry
        run: |
          desktop-file-validate data/io.github.Dackerie.Showberry.desktop

      - name: Validate AppStream Metadata
        run: |
          appstreamcli validate --no-net data/io.github.Dackerie.Showberry.metainfo.xml

      - name: Run Test Suite
        env:
          GSK_RENDERER: cairo
          GSETTINGS_SCHEMA_DIR: data
          PYTHONPATH: .
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" pytest tests/ -v -ra --tb=short 2>&1 | tee pytest_output.log

      - name: Report Test Results
        if: always()
        run: |
          if [ -f pytest_output.log ]; then
            echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(FAILED|ERROR)" pytest_output.log | while IFS= read -r line; do
              echo "::error title=Pytest Failure::$line"
            done
          fi

      - name: Build Python Wheel
        run: |
          python -m build --wheel --no-isolation
