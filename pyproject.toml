[project]
name = "showberry"
version = "0.1.0"
description = "A modern movie and TV series streaming application for GNOME"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.48",
    "python-mpv>=1.0",
    "PyOpenGL>=3.1",
    "requests>=2.31",
    "Pillow>=10.0",
    "curl_cffi>=0.7.0",
    "pycryptodome>=3.20.0",
]

[project.scripts]
showberry = "showberry.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["showberry*"]
